<head>

    <style class="site-preloader-style">
        /* Variables CSS pour le thème */
        :root {
            --primary-color: #1976d2;
            --secondary-color: #ff4081;
            --success-color: #4caf50;
            --background-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-color: #333;
            --text-light: #666;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden !important;
        }

        /* Splash Screen Principal */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: var(--background-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }

        #splash-screen.fade-out {
            opacity: 0;
            transform: scale(0.9);
        }

        .splash-content {
            text-align: center;
            max-width: 400px;
            padding: 40px 20px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .splash-content::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            50% { transform: translateX(100%) translateY(100%) rotate(45deg); }
            100% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
        }

        /* Logo Animé */
        .splash-logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            position: relative;
            z-index: 1;
        }

        .splash-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: logoFloat 2s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0px) scale(1);
            }
            50% {
                transform: translateY(-10px) scale(1.05);
            }
        }

        /* Titre et sous-titre */
        .splash-title {
            font-size: 28px;
            font-weight: bold;
            color: var(--text-color);
            margin: 0 0 8px 0;
            position: relative;
            z-index: 1;
        }

        .splash-subtitle {
            font-size: 14px;
            color: var(--text-light);
            margin: 0 0 30px 0;
            position: relative;
            z-index: 1;
        }

        /* Loader moderne */
        .modern-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            position: relative;
            z-index: 1;
        }

        .loader-ring {
            width: 60px;
            height: 60px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            position: relative;
        }

        .loader-ring::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border: 2px solid transparent;
            border-top: 2px solid var(--secondary-color);
            border-radius: 50%;
            animation: spin 2s linear infinite reverse;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Points de chargement */
        .loading-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            position: relative;
            z-index: 1;
        }

        .dot {
            width: 8px;
            height: 8px;
            margin: 0 3px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: dotPulse 1.4s ease-in-out infinite both;
        }

        .dot:nth-child(2) { animation-delay: -0.32s; }
        .dot:nth-child(3) { animation-delay: -0.16s; }

        @keyframes dotPulse {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        /* Message de chargement */
        .loading-message {
            font-size: 16px;
            color: var(--text-color);
            margin: 15px 0 5px 0;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        .loading-quote {
            font-size: 13px;
            color: var(--text-light);
            font-style: italic;
            margin: 0;
            position: relative;
            z-index: 1;
        }

        /* Barre de progression */
        .progress-container {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin: 20px 0;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 2px;
            animation: progressAnimation 3s ease-in-out infinite;
        }

        @keyframes progressAnimation {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        /* Version info */
        .version-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.1);
            padding: 5px 10px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        /* Gestion d'erreur */
        .error-message {
            text-align: center;
            color: var(--text-color);
            position: relative;
            z-index: 1;
        }

        .error-message h3 {
            color: #e74c3c;
            margin: 0 0 10px 0;
        }

        .retry-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .retry-btn:hover {
            background: #1565c0;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(25,101,192,0.3);
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .splash-content {
                margin: 20px;
                padding: 30px 15px;
            }
            
            .splash-logo {
                width: 80px;
                height: 80px;
            }
            
            .splash-title {
                font-size: 24px;
            }
        }

        /* Animation d'entrée */
        .splash-content {
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1976d2">
</head>

<body>
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">
                <img src="img/logo.svg" alt="MSPOS Logo" />
            </div>
            
            <h1 class="splash-title">MSPOS V3</h1>
            <p class="splash-subtitle">Système de Gestion Moderne</p>
            
            <div class="modern-loader">
                <div class="loader-ring"></div>
            </div>
            
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            
            <p class="loading-message">Chargement en cours...</p>
            <p class="loading-quote">"Optimiser votre gestion avec MSPOS"</p>
        </div>
        
        <div class="version-info">v3.1.0</div>
    </div>
    
    <app-root></app-root>
    
    <script>
        // Messages de chargement dynamiques
        const loadingMessages = [
            "Initialisation de l'application...",
            "Chargement des modules...",
            "Configuration en cours...",
            "Préparation de l'interface...",
            "Finalisation du démarrage..."
        ];
        
        const quotes = [
            "Optimiser votre gestion avec MSPOS",
            "La performance au service de votre entreprise",
            "Simplifiez vos processus métier",
            "Innovation et efficacité réunies",
            "Votre partenaire technologique de confiance"
        ];

        let messageIndex = 0;
        let quoteIndex = 0;

        function updateLoadingText() {
            const messageEl = document.querySelector('.loading-message');
            const quoteEl = document.querySelector('.loading-quote');
            
            if (messageEl) {
                messageEl.textContent = loadingMessages[messageIndex];
                messageIndex = (messageIndex + 1) % loadingMessages.length;
            }
            
            if (quoteEl) {
                quoteEl.textContent = `"${quotes[quoteIndex]}"`;
                quoteIndex = (quoteIndex + 1) % quotes.length;
            }
        }

        // Changer les messages toutes les 800ms
        const messageInterval = setInterval(updateLoadingText, 800);

        // Gestion du splash screen améliorée
        window.addEventListener('DOMContentLoaded', function () {
            const appRoot = document.querySelector('app-root');
            const splashScreen = document.getElementById('splash-screen');
            
            if (!appRoot || !splashScreen) return;

            // Timeout de sécurité pour masquer le splash après 10 secondes max
            const fallbackTimeout = setTimeout(() => {
                console.log('Timeout: masquage forcé du splash screen');
                hideSplashScreen();
            }, 10000);

            // Observer pour détecter quand Angular est prêt
            const observer = new MutationObserver(function(mutations) {
                // Vérifier si l'app-root a du contenu
                if (appRoot.children.length > 0) {
                    clearTimeout(fallbackTimeout);
                    clearInterval(messageInterval);
                    
                    // Petit délai pour que l'utilisateur voie l'animation complète
                    setTimeout(() => {
                        hideSplashScreen();
                    }, 500);
                    
                    observer.disconnect();
                }
            });

            observer.observe(appRoot, { 
                childList: true, 
                subtree: true 
            });

            function hideSplashScreen() {
                if (splashScreen) {
                    splashScreen.classList.add('fade-out');
                    setTimeout(() => {
                        splashScreen.remove();
                        // Nettoyage des styles du preloader
                        const preloaderStyle = document.querySelector('.site-preloader-style');
                        if (preloaderStyle) {
                            preloaderStyle.remove();
                        }
                    }, 500);
                }
            }
        });

        // Gestion des erreurs de chargement
        window.addEventListener('error', function(e) {
            console.error('Erreur détectée:', e);
            const splashScreen = document.getElementById('splash-screen');
            if (splashScreen) {
                clearInterval(messageInterval);
                splashScreen.innerHTML = `
                    <div class="splash-content">
                        <div class="error-message">
                            <h3>⚠️ Erreur de chargement</h3>
                            <p>Une erreur s'est produite lors du démarrage</p>
                            <p style="font-size: 12px; color: #666;">${e.message || 'Erreur inconnue'}</p>
                            <button onclick="window.location.reload()" class="retry-btn">
                                🔄 Recharger l'application
                            </button>
                        </div>
                    </div>
                `;
            }
        });
    </script>
    
    <noscript>
        <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
            <h2>JavaScript requis</h2>
            <p>Veuillez activer JavaScript pour utiliser cette application.</p>
        </div>
    </noscript>
</body>
