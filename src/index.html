<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <title>MSPOS-V3</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <!-- <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" /> -->

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style class="site-preloader-style">
        @keyframes site-preloader-animation {
            from {
                transform: rotateZ(0deg);
            }

            to {
                transform: rotateZ(360deg);
            }
        }

        body {
            overflow: hidden !important;
            overflow-y: scroll !important;
            height: 100% !important;
        }

        .site-preloader {
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background-color: #fafafa;
            z-index: 99999;
            opacity: 1;
        }

        .site-preloader::before {
            box-sizing: border-box;
            content: '';
            display: block;
            position: absolute;
            left: calc(50% - 50px);
            top: calc(50% - 50px);
            width: 100px;
            height: 100px;
            border-radius: 50px;
            border: 3px solid rgba(0, 0, 0, .2);
            border-top-color: rgba(0, 0, 0, .6);

            animation-name: site-preloader-animation;
            animation-duration: .5s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        .site-preloader__fade {
            transition: opacity .3s;
            opacity: 0;
        }

        /* Ajout d'un style pour le splash screen moderne */
        #splash-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background-color: #fafafa;
            z-index: 99999;
        }

        .splash-content {
            text-align: center;
        }

        .splash-logo {
            max-width: 150px;
            margin-bottom: 20px;
        }

        .splash-spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Styles pour le nouveau splash screen */
        .animated-logo {
            animation: logoAnimation 1.5s ease-in-out infinite;
        }

        @keyframes logoAnimation {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .splash-bounce-loader {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin: 10px 0;
        }

        .bounce-dot {
            width: 10px;
            height: 10px;
            margin: 0 5px;
            background-color: #1976d2;
            border-radius: 50%;
            animation: bounce 0.6s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .splash-message {
            font-size: 18px;
            color: #333;
            margin-top: 10px;
        }

        .splash-quote {
            display: block;
            font-style: italic;
            font-size: 14px;
            color: #777;
            margin-top: 5px;
        }
    </style>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1976d2">
</head>

<body>
    <div class="site-preloader" id="splash-screen">
        <div class="splash-content">
            <img src="img/logo.svg" alt="Logo" class="splash-logo animated-logo" />
            <div class="splash-bounce-loader">
                <div class="bounce-dot"></div>
                <div class="bounce-dot"></div>
                <div class="bounce-dot"></div>
            </div>
            <div class="splash-message">Bienvenue sur MSPOS !<br>
                <span class="splash-quote">« Gagner du temps avec MSPOS. »</span>
            </div>
        </div>
    </div>
    <app-root></app-root>
    <script>
        // Hide splash when Angular is ready
        window.addEventListener('DOMContentLoaded', function () {
            var appRoot = document.querySelector('app-root');
            if (appRoot) {
                var observer = new MutationObserver(function () {
                    var splash = document.getElementById('splash-screen');
                    if (splash && appRoot.childNodes.length > 0) {
                        splash.classList.add('site-preloader__fade');
                        setTimeout(function () {
                            splash.style.display = 'none';
                        }, 400);
                        observer.disconnect();
                    }
                });
                observer.observe(appRoot, { childList: true });
            }
        });
    </script>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
