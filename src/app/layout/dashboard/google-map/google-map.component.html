<div class="page-wrapper">
  <div class="content">

    <!-- ═══════════════════════════════════════════════════════════════════
         PAGE HEADER
    ══════════════════════════════════════════════════════════════════════ -->
    <div class="page-header">
      <div class="row align-items-center">
        <div class="col-8">
          <h4 class="page-title">
            <i class="ti ti-map-pin me-1"></i>Carte des visites
            <span class="count-title ms-2">{{ googleMapList().length | number }}</span>
          </h4>
        </div>
        <div class="col-4 text-end">
          <div class="head-icons">
            <a href="javascript:void(0);" title="Actualiser" (click)="refresh()">
              <i class="ti ti-refresh" [class.gm-spin]="isLoading()"></i>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════════
         FILTER BAR
    ══════════════════════════════════════════════════════════════════════ -->
    <div class="card gm-filter-card mb-4">
      <div class="card-body py-3">
        <form [formGroup]="filterForm" class="row g-3 align-items-end">

          <!-- Quick period selector -->
          <div class="col-12">
            <label class="form-label gm-label">
              <i class="ti ti-calendar me-1"></i>Période
            </label>
            <div class="obs-period-group" role="group">
              <button
                *ngFor="let p of periods"
                type="button"
                class="obs-period-btn"
                [class.active]="selectedPeriod() === p.key"
                (click)="setPeriod(p.key)"
              >{{ p.label }}</button>
            </div>
          </div>

          <!-- Search -->
          <div class="col-md-4">
            <label class="form-label gm-label">
              <i class="ti ti-search me-1"></i>Recherche
            </label>
            <div class="input-group">
              <span class="input-group-text"><i class="ti ti-search"></i></span>
              <input
                type="text"
                class="form-control form-control-sm"
                placeholder="ASM, Superviseur, DR, Cyclo…"
                formControlName="search"
              />
            </div>
          </div>

          <!-- Province -->
          <div class="col-md-4">
            <label class="form-label gm-label">
              <i class="ti ti-map me-1"></i>Province
            </label>
            <select class="form-select form-select-sm" formControlName="province_uuid">
              <option value="">Toutes les provinces</option>
              <option *ngFor="let prov of provinceList()" [value]="prov.uuid">
                {{ prov.name }}
              </option>
            </select>
          </div>

          <!-- User type -->
          <div class="col-md-4">
            <label class="form-label gm-label">
              <i class="ti ti-users me-1"></i>Rôle
            </label>
            <select class="form-select form-select-sm" formControlName="user_type">
              <option *ngFor="let ut of userTypes" [value]="ut.key">{{ ut.label }}</option>
            </select>
          </div>

        </form>
      </div>
    </div>

    <!-- Map error state -->
    <div *ngIf="hasMapError()" class="alert alert-danger d-flex align-items-center" role="alert">
      <i class="ti ti-alert-triangle me-2 fs-5"></i>
      <div>{{ mapErrorMsg() }}</div>
    </div>

    <!-- Map card -->
    <app-map-card
      [isLoading]="isLoading()"
      [googleMapList]="googleMapList()"
    ></app-map-card>

  </div>
</div>
