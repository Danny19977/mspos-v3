<div class="page-wrapper">
  <div class="content">

    <!-- ═══════════════════════════════════════════════════════════════════
         PAGE HEADER
    ══════════════════════════════════════════════════════════════════════ -->
    <div class="page-header">
      <div class="row align-items-center">
        <div class="col-md-6">
          <h4 class="page-title">
            <i class="ti ti-map-pin me-1"></i>Carte des visites
            <span class="count-title ms-2">{{ googleMapList().length | number }}</span>
          </h4>
        </div>
        <div class="col-md-6 d-flex justify-content-end align-items-center gap-2 flex-wrap">

          <!-- Period dropdown -->
          <div class="dropdown">
            <button class="btn nd-period-toggle dropdown-toggle" type="button"
              data-bs-toggle="dropdown" aria-expanded="false">
              <i class="ti ti-calendar-stats me-1"></i>
              {{ getPeriodLabel() }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end nd-period-menu shadow-sm">
              @for (p of periods; track p.key) {
                @if (p.key !== 'custom') {
                  <li>
                    <button class="dropdown-item nd-period-item"
                      [class.active]="selectedPeriod() === p.key"
                      (click)="setPeriod(p.key)">
                      <i class="ti {{ selectedPeriod() === p.key ? 'ti-check' : 'ti-point' }} me-2"></i>
                      {{ p.label }}
                    </button>
                  </li>
                }
              }
              <li><hr class="dropdown-divider my-1"></li>
              <li>
                <button class="dropdown-item nd-period-item"
                  [class.active]="selectedPeriod() === 'custom'"
                  (click)="setPeriod('custom')">
                  <i class="ti {{ selectedPeriod() === 'custom' ? 'ti-check' : 'ti-calendar-event' }} me-2"></i>
                  Personnalisé
                </button>
              </li>
            </ul>
          </div>

          <!-- Inline date-range picker (custom only) -->
          @if (selectedPeriod() === 'custom') {
            <div class="gm-date-field">
              <i class="ti ti-calendar-event"></i>
              <input
                type="text"
                class="form-control gm-date-input"
                placeholder="Début — Fin"
                bsDaterangepicker
                [(ngModel)]="customRange"
                [bsConfig]="{ dateInputFormat: 'DD/MM/YYYY', containerClass: 'theme-dark-blue', showWeekNumbers: false, adaptivePosition: true }"
                (bsValueChange)="onCustomRangeChange($event)"
                autocomplete="off"
              />
            </div>
          }

          <div class="head-icons mb-0">
            <a href="javascript:void(0);" title="Actualiser" (click)="refresh()">
              <i class="ti ti-refresh" [class.gm-spin]="isLoading()"></i>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════════
         FILTER BAR
    ══════════════════════════════════════════════════════════════════════ -->
    <div class="card gm-filter-card mb-4">
      <div class="card-body py-3">
        <form [formGroup]="filterForm" class="row g-3 align-items-end">

          <!-- Search -->
          <div class="col-md-4">
            <label class="form-label gm-label">
              <i class="ti ti-search me-1"></i>Recherche
            </label>
            <div class="input-group">
              <span class="input-group-text"><i class="ti ti-search"></i></span>
              <input
                type="text"
                class="form-control form-control-sm"
                placeholder="ASM, Superviseur, DR, Cyclo…"
                formControlName="search"
              />
            </div>
          </div>

          <!-- Province -->
          <div class="col-md-4">
            <label class="form-label gm-label">
              <i class="ti ti-map me-1"></i>Province
            </label>
            <select class="form-select form-select-sm" formControlName="province_uuid">
              <option value="">Toutes les provinces</option>
              <option *ngFor="let prov of provinceList()" [value]="prov.uuid">
                {{ prov.name }}
              </option>
            </select>
          </div>

          <!-- User type -->
          <div class="col-md-4">
            <label class="form-label gm-label">
              <i class="ti ti-users me-1"></i>Rôle
            </label>
            <div class="gm-role-dropdown dropdown">
              <button
                type="button"
                class="gm-role-toggle dropdown-toggle"
                data-bs-toggle="dropdown"
                aria-expanded="false">
                <ng-container *ngIf="filterForm.get('user_type')!.value as key">
                  <span
                    class="gm-role-dot"
                    [style.background]="roleColor(key)"
                  ></span>
                </ng-container>
                {{ getRoleLabel(filterForm.get('user_type')!.value) }}
              </button>
              <ul class="dropdown-menu gm-role-menu shadow-sm">
                <li *ngFor="let ut of userTypes">
                  <button
                    type="button"
                    class="dropdown-item gm-role-item"
                    [class.active]="filterForm.get('user_type')!.value === ut.key"
                    (click)="selectRole(ut.key)">
                    <span
                      class="gm-role-dot"
                      [style.background]="roleColor(ut.key)"
                      [style.visibility]="ut.key ? 'visible' : 'hidden'"
                    ></span>
                    {{ ut.label }}
                  </button>
                </li>
              </ul>
            </div>
          </div>

        </form>
      </div>
    </div>

    <!-- Map error state -->
    <div *ngIf="hasMapError()" class="alert alert-danger d-flex align-items-center" role="alert">
      <i class="ti ti-alert-triangle me-2 fs-5"></i>
      <div>{{ mapErrorMsg() }}</div>
    </div>

    <!-- Map card -->
    <app-map-card
      [isLoading]="isLoading()"
      [googleMapList]="googleMapList()"
      [selectedProvinceName]="selectedProvinceName"
    ></app-map-card>

  </div>
</div>
